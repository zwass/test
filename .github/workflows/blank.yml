# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: macos-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          sh -c 'mdfind -literal "kMDItemFSName = \"*.app\"" -count'
          echo $?
          sh -c 'mdutil -s / | grep disabled'
          echo $?
          sh -c 'mdfind -literal "kMDItemFSName = \"*.app\"" -count'
          echo $?
          mdutil -s /
          echo $?
  build2:
    # The type of runner that the job will run on
    runs-on: macos-13

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          mdutil -s /
          sh -c 'mdfind -literal "kMDItemFSName = \"*.app\"" -count'
          echo $?
          sh -c 'mdutil -s / | grep disabled'
          echo $?
          sh -c 'mdfind -literal "kMDItemFSName = \"*.app\"" -count'
          echo $?
          mdutil -s /
          echo $?
          
  docker:
    runs-on: ubuntu-22.04
    container:
      image: osquery/builder20.04:7e9ee0339
      options: --privileged --init -v /var/run/docker.sock:/var/run/docker.sock --pid=host --user 1001
    steps:
      - name: test docker
        run: |
          sudo chmod 666 /var/run/docker.sock
          sudo gpasswd -a $(whoami) docker
          sudo apt-get update
          sudo apt-get install -y socat
          ls -l /var/run/docker.sock
          who
          whoami
          groups
          socat -u OPEN:/dev/null UNIX-CONNECT:/var/run/docker.sock
